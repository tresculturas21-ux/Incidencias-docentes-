<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTC | Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand-mark">UTC</div>
      <h1>Control de Incidencias Docentes</h1>
      <p>Registro, seguimiento y análisis de incidencias operativas y administrativas.</p>
    </section>

    <section class="login-card">
      <div>
        <span class="login-eyebrow">Acceso al sistema</span>
        <h2>Iniciar sesión</h2>
        <p class="help">Ingresa con el correo o usuario asignado.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="loginUser">Correo o usuario</label>
          <input id="loginUser" autocomplete="username" required placeholder="Ej. operativo1 o correo@dominio.com">
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
        </div>
        <p id="loginError" class="login-error" hidden></p>
        <button id="loginButton" class="btn btn-primary login-submit" type="submit">Entrar</button>
      </form>

      <p class="login-note">Las contraseñas se validan de forma segura mediante Supabase Authentication.</p>
    </section>
  </main>

  <script>
    const config = window.APP_CONFIG || {};
    const errorBox = document.getElementById('loginError');
    const button = document.getElementById('loginButton');

    if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY || !window.supabase) {
      errorBox.hidden = false;
      errorBox.textContent = 'Falta configurar Supabase en config.js.';
      button.disabled = true;
    } else {
      const client = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      client.auth.getSession().then(({ data }) => {
        if (data.session) window.location.replace('index.html');
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = 'Ingresando...';

        const enteredUser = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPassword').value;
        const domain = String(config.AUTH_EMAIL_DOMAIN || '').replace(/^@/, '');
        const email = enteredUser.includes('@') ? enteredUser : `${enteredUser}@${domain}`;

        try {
          if (!enteredUser.includes('@') && !domain) {
            throw new Error('Escribe el correo completo del usuario.');
          }

          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const { data: profile, error: profileError } = await client
            .from('perfiles')
            .select('id,nombre,rol,activo')
            .eq('id', data.user.id)
            .single();

          if (profileError) throw new Error('El usuario inició sesión, pero no tiene un perfil válido.');
          if (profile.activo === false) {
            await client.auth.signOut();
            throw new Error('Este usuario está desactivado.');
          }

          window.location.href = 'index.html';
        } catch (error) {
          console.error(error);
          errorBox.hidden = false;
          errorBox.textContent = error.message === 'Invalid login credentials'
            ? 'Usuario o contraseña incorrectos.'
            : error.message;
        } finally {
          button.disabled = false;
          button.textContent = 'Entrar';
        }
      });
    }
  </script>
</body>
</html>
