<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTC | Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand-mark">UTC</div>
      <h1>Control de Incidencias Docentes</h1>
      <p>Registro, seguimiento y análisis de incidencias operativas y administrativas.</p>
    </section>

    <section class="login-card">
      <div>
        <span class="login-eyebrow">Acceso al sistema</span>
        <h2>Iniciar sesión</h2>
        <p class="help">Ingresa con el usuario y la contraseña asignados.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="loginUser">Usuario</label>
          <input id="loginUser" autocomplete="username" required placeholder="Ej. administrador">
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
        </div>
        <p id="loginError" class="login-error" hidden></p>
        <button id="loginButton" class="btn btn-primary login-submit" type="submit">Entrar</button>
      </form>
      <p class="login-note">Las credenciales se validan directamente en Supabase.</p>
    </section>
  </main>

  <script>
    (() => {
      const config = window.APP_CONFIG || {};
      const errorBox = document.getElementById('loginError');
      const button = document.getElementById('loginButton');

      if (localStorage.getItem('utc_docentes_session')) {
        window.location.replace('index.html');
        return;
      }

      if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY || config.SUPABASE_URL.includes('PEGA_AQUI')) {
        errorBox.hidden = false;
        errorBox.textContent = 'Falta configurar la URL y la clave pública de Supabase en config.js.';
        button.disabled = true;
        return;
      }

      const db = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = 'Validando...';

        try {
          const usuario = document.getElementById('loginUser').value.trim();
          const contrasena = document.getElementById('loginPassword').value;

          const { data, error } = await db.rpc('validar_acceso', {
            p_usuario: usuario,
            p_contrasena: contrasena
          });

          if (error) throw error;
          const account = Array.isArray(data) ? data[0] : data;
          if (!account || account.valido === false || account.activo === false) {
            throw new Error('Usuario o contraseña incorrectos.');
          }

          const name = account.nombre || account.name || usuario;
          const role = String(account.rol || account.role || 'operativo').toLowerCase();
          const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase();

          localStorage.setItem('utc_docentes_session', JSON.stringify({
            id: account.id || null,
            username: usuario,
            name,
            role,
            initials
          }));
          window.location.href = 'index.html';
        } catch (error) {
          console.error(error);
          errorBox.hidden = false;
          errorBox.textContent = error.message || 'No fue posible iniciar sesión.';
        } finally {
          button.disabled = false;
          button.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
